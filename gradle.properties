# Project-wide Gradle settings.
# FIX: -Xmx4096m konnte auf Maschinen mit 4 GB RAM nicht halten — der Gradle-
# Daemon wurde vom OOM-Killer beendet ("DaemonDisappearedException"). 1536 MB
# Heap + 512 MB Metaspace reichen fuer dieses Modul und laufen auch auf kleinen
# CI-/Dev-Maschinen stabil.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
